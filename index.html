<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dearly — Turn what you write into something worth sending.</title>
    <meta name="description" content="Turn what you write into something worth sending." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <!--
      Cheap HTTP-level preload so the browser starts fetching the Tegaki
      fonts as soon as it parses <head>. The actual registration into
      document.fonts happens in src/lib/tegakiFont.js via a binary-buffer
      FontFace (the only path Safari reliably accepts — see that file's
      comment block for the full Safari-FontFace-SyntaxError saga).
    -->
    <link rel="preload" href="/fonts/caveat-subset.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/caveat-full.ttf"   as="font" type="font/ttf" crossorigin />
    <!--
      Safari fixes for Tegaki's FontFace usage. Two distinct issues, one shim:

      1. featureSettings — Tegaki sometimes passes
         { featureSettings: "'calt' 0, 'liga' 0" } as the descriptors arg.
         Safari throws SyntaxError on that. Strip it before construct.

      2. Unquoted url() source — Tegaki calls
         new FontFace(family, `url(${url})`)
         which produces e.g. `url(/fonts/caveat-subset.ttf)`. Chrome accepts
         the unquoted form; Safari throws "The string did not match the
         expected pattern" because its CSS parser wants the url quoted.
         Rewrite `url(<unquoted>)` → `url("<unquoted>")` before construct.
         Skips strings already containing a quote so we don't double-quote.

         Without this fix the FontFace promise rejects in Safari, Tegaki's
         engine bails, and any UI gated on Tegaki onComplete never advances
         — e.g. the Recipient preview renders an empty greeting and never
         moves to the folded letter phase, so the user sees a blank screen.
    -->
    <script>
      (function () {
        if (typeof FontFace === 'undefined' || typeof Proxy === 'undefined') return;
        window.FontFace = new Proxy(FontFace, {
          construct: function (Target, args) {
            if (args[2] && args[2].featureSettings !== undefined) {
              var cleaned = Object.assign({}, args[2]);
              delete cleaned.featureSettings;
              args = [args[0], args[1], cleaned];
            }
            // Auto-quote unquoted url() sources for Safari.
            if (typeof args[1] === 'string') {
              args[1] = args[1].replace(
                /url\(\s*([^"')\s][^)]*?)\s*\)/g,
                function (_, inner) { return 'url("' + inner + '")'; }
              );
            }
            return Reflect.construct(Target, args);
          }
        });
      })();
    </script>
    <!--
      Helper: detect whether a Vite env-var placeholder actually got
      substituted. When the var isn't defined Vite leaves the literal
      `%VITE_FOO%` token in the HTML — so a string like "%VITE_GA_ID%"
      should be treated as "not set" rather than a real ID. Catches:
        • empty / falsy
        • bare name without % wrappers (e.g. "VITE_GA_ID")
        • untouched placeholder (e.g. "%VITE_GA_ID%")
      Anything else is assumed to be a real, configured ID.
    -->
    <script>
      window.__isViteEnvSet = function (val) {
        if (!val) return false;
        if (typeof val !== 'string') return true;
        if (val.indexOf('VITE_') === 0) return false;
        if (val.charAt(0) === '%' && val.charAt(val.length - 1) === '%') return false;
        return true;
      };
    </script>
    <!-- Google Analytics (only loads when VITE_GA_ID is set) -->
    <script>
      (function() {
        var id = '%VITE_GA_ID%';
        if (!window.__isViteEnvSet(id)) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function() { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', id, { send_page_view: false });
      })();
    </script>
    <!-- Microsoft Clarity (only loads when VITE_CLARITY_ID is set) -->
    <script>
      (function() {
        var id = '%VITE_CLARITY_ID%';
        if (!window.__isViteEnvSet(id)) return;
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", id);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
